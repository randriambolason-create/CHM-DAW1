
name: CHM DAW - Build Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: windows-latest

    steps:
      - name: Download Ardour source
        uses: actions/checkout@v4
        with:
          repository: Ardour/ardour
          path: ardour
          fetch-depth: 1

      - name: Check Windows build tools
        shell: cmd
        run: |
          echo === CHM DAW WINDOWS DIAGNOSTIC ===

          cmake --version
          python --version
          git --version

          echo === FIND VISUAL STUDIO ===
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          if not exist "%VSWHERE%" exit /b 1

          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"

          if not defined VS_PATH exit /b 1

          echo Visual Studio: %VS_PATH%

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          echo === MSVC VERSION ===
          cl

          echo === ARDOUR SOURCE ===
          if not exist ardour\wscript exit /b 1

          echo CHM DAW diagnostic completed

      - name: Save diagnostic report
        if: always()
        shell: pwsh
        run: |
          "CHM DAW diagnostic executed" |
            Out-File diagnostic.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chm-diagnostic
          path: diagnostic.txt
