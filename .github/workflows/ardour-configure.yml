
name: CHM DAW - Boost MSVC Test

on:
  workflow_dispatch:

jobs:
  boost-test:
    runs-on: windows-latest

    steps:
      - name: Download Ardour
        uses: actions/checkout@v4
        with:
          repository: Ardour/ardour
          path: ardour
          fetch-depth: 1

      - name: Install Boost
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          & $vcpkg install boost-headers:x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "Boost installation failed"
          }

      - name: Inspect Boost installation
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT

          Write-Host "VCPKG ROOT: $root"

          Write-Host "Installed directory:"
          Get-ChildItem "$root\installed" -ErrorAction SilentlyContinue |
            Select-Object FullName

          Write-Host "Boost header package contents:"
          Get-ChildItem "$root\packages\boost-headers_x64-windows" `
            -Recurse -File -ErrorAction SilentlyContinue |
            Select-Object -First 40 -ExpandProperty FullName

          Write-Host "Boost installed file list:"
          $list = "$root\installed\vcpkg\info"
          Get-ChildItem $list -Filter "boost-headers*.list" `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Get-Content $_.FullName |
                Select-String "version.hpp|boost/"
            }

      - name: Save diagnostic report
        if: always()
        shell: pwsh
        run: |
          "Boost inspection completed" |
            Out-File boost-inspection.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boost-inspection
          path: boost-inspection.txt
