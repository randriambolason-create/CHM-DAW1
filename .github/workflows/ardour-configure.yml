
name: CHM DAW - Boost Diagnostic

on:
  workflow_dispatch:

jobs:
  boost-diagnostic:
    runs-on: windows-latest

    steps:
      - name: Download Ardour
        uses: actions/checkout@v4
        with:
          repository: Ardour/ardour
          path: ardour
          fetch-depth: 1

      - name: Install Boost with vcpkg
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"

          if (!(Test-Path $vcpkg)) {
            throw "vcpkg not found"
          }

          & $vcpkg install boost:x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "Boost installation failed"
          }

      - name: Verify Boost headers
        shell: pwsh
        run: |
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"

          $header = Join-Path $root "include\boost\version.hpp"

          if (!(Test-Path $header)) {
            throw "Boost headers not found"
          }

          Write-Host "Boost headers found"
          Get-Content $header |
            Select-String "BOOST_LIB_VERSION"

      - name: Upload diagnostic
        if: always()
        shell: pwsh
        run: |
          "CHM DAW Boost diagnostic completed" |
            Out-File boost-report.txt

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chm-boost-report
          path: boost-report.txt
