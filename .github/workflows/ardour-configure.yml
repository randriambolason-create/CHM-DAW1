
name: CHM DAW - Locate Boost Headers

on:
  workflow_dispatch:

jobs:
  locate-boost:
    runs-on: windows-latest

    steps:
      - name: Install Boost headers
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"

          & $vcpkg install boost-headers:x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "Boost installation failed"
          }

      - name: Locate Boost version.hpp
        shell: pwsh
        run: |
          Write-Host "VCPKG ROOT:"
          Write-Host $env:VCPKG_INSTALLATION_ROOT

          Write-Host "Searching installed and packages..."

          $root = $env:VCPKG_INSTALLATION_ROOT

          $matches = @(
            Get-ChildItem `
              -Path "$root\installed", "$root\packages" `
              -Filter version.hpp `
              -Recurse `
              -File `
              -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '[\\/]boost[\\/]version\.hpp$'
            }
          )

          if ($matches.Count -eq 0) {
            Write-Host "No Boost version.hpp found"
            throw "Boost header location unknown"
          }

          foreach ($file in $matches) {
            Write-Host "FOUND: $($file.FullName)"
          }
