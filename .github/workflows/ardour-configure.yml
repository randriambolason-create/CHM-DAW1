
name: CHM DAW - GLib Dependency Test

on:
  workflow_dispatch:

jobs:
  glib-test:
    runs-on: windows-latest

    steps:
      - name: Install GLib
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"

          & $vcpkg install glib:x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "GLib installation failed"
          }

      - name: Find pkg-config and GLib
        shell: pwsh
        run: |
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"

          Write-Host "Checking GLib headers:"
          Get-ChildItem "$root\include" -Recurse -Filter glib.h -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          Write-Host "Checking GLib pkg-config files:"
          Get-ChildItem "$root" -Recurse -Filter glib-2.0.pc -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

          Write-Host "Checking pkg-config:"
          Get-Command pkg-config -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Source

          Write-Host "Checking pkgconf:"
          Get-Command pkgconf -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Source
