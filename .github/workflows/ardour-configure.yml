
name: CHM DAW - Boost and Ardour Configure

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: windows-latest

    steps:
      - name: Download Ardour
        uses: actions/checkout@v4
        with:
          repository: Ardour/ardour
          path: ardour
          fetch-depth: 1

      - name: Install Boost headers
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"

          if (!(Test-Path $vcpkg)) {
            throw "vcpkg not found"
          }

          & $vcpkg install boost-headers:x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "Boost installation failed"
          }

          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          $header = Join-Path $root "include\boost\version.hpp"

          if (!(Test-Path $header)) {
            throw "Boost headers missing"
          }

          Write-Host "Boost headers ready"

      - name: Configure Ardour with Boost and MSVC
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"

          if not defined VS_PATH exit /b 1

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          set "BOOST_ROOT=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows"

          cd ardour

          python waf configure --check-c-compiler=msvc --check-cxx-compiler=msvc --dist-target=msvc --boost-include="%BOOST_ROOT%\include" --noconfirm

      - name: Upload configuration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chm-ardour-configure-logs
          path: |
            ardour/build/config.log
            ardour/build/c4che/
          if-no-files-found: warn
