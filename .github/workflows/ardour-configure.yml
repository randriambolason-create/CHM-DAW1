
name: CHM DAW - Windows Xmake Dependencies

on:
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Check tools
        shell: pwsh
        run: |
          xmake --version
          xrepo --version
          git --version

      - name: Download Ardour dependency recipe
        shell: pwsh
        run: |
          git clone https://gist.github.com/0e3f7bf6380c086e9ff57f8f34298172.git recipe

          New-Item -ItemType Directory -Force -Path stack | Out-Null

          Copy-Item recipe/ardour-depxs-xmakes.lua stack/xmake.lua

          if (!(Test-Path stack/xmake.lua)) {
            throw "Dependency recipe missing"
          }

          Get-Content stack/xmake.lua -TotalCount 20

      - name: Update Xrepo
        shell: pwsh
        run: |
          xrepo update-repo
          if ($LASTEXITCODE -ne 0) {
            throw "Xrepo update failed"
          }

      - name: Configure dependency stack
        shell: pwsh
        working-directory: stack
        run: |
          xmake f -c -y
          if ($LASTEXITCODE -ne 0) {
            throw "Xmake configuration failed"
          }

      - name: Build dependency stack
        shell: pwsh
        working-directory: stack
        run: |
          xmake -y
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency build failed"
          }

      - name: Inspect dependencies
        shell: pwsh
        run: |
          if (Test-Path stack/release) {
            Get-ChildItem stack/release
            Get-ChildItem stack/release -Recurse -Filter "*.pc" |
              Select-Object -First 40 -ExpandProperty FullName
          } else {
            throw "Release dependency folder missing"
          }

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chm-daw-xmake-diagnostics
          path: |
            stack/.xmake/
            stack/build/
          if-no-files-found: ignore
