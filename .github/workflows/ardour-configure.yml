
name: CHM DAW - MSVC Toolchain Test

on:
  workflow_dispatch:

jobs:
  test-msvc:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (!$vs) {
            throw "Visual Studio C++ tools not found"
          }

          Write-Host "Visual Studio: $vs"

          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"

          if (!(Test-Path $vcvars)) {
            throw "vcvars64.bat missing"
          }

          "VCVARS=$vcvars" >> $env:GITHUB_ENV

      - name: Initialize MSVC and verify tools
        shell: cmd
        run: |
          @echo off
          call "%VCVARS%"
          if errorlevel 1 exit /b 1

          echo Checking C++ compiler
          where cl
          if errorlevel 1 exit /b 1

          echo Checking Microsoft assembler
          where ml64
          if errorlevel 1 exit /b 1

          echo Checking linker
          where link
          if errorlevel 1 exit /b 1

          echo MSVC toolchain ready
