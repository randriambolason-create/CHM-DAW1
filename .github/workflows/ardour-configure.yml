
name: CHM DAW - Boost and Ardour Configure

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: windows-latest

    steps:
      - name: Download Ardour
        uses: actions/checkout@v4
        with:
          repository: Ardour/ardour
          path: ardour
          fetch-depth: 1

      - name: Install and locate Boost
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          & $vcpkg install boost-headers:x64-windows

          if ($LASTEXITCODE -ne 0) {
            throw "Boost installation failed"
          }

          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"

          $headers = Get-ChildItem `
            -Path "$root\include" `
            -Filter version.hpp `
            -Recurse |
            Where-Object {
              $_.FullName -match 'boost[\\/]version.hpp$'
            }

          if (!$headers) {
            throw "Boost version.hpp not found"
          }

          $boostDir = Split-Path `
            (Split-Path $headers[0].FullName -Parent) `
            -Parent

          Write-Host "Boost include directory: $boostDir"

          "BOOST_INCLUDE=$boostDir" >> $env:GITHUB_ENV

      - name: Configure Ardour with MSVC
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"

          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"

          if not defined VS_PATH exit /b 1

          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"

          cd ardour

          python waf configure --check-c-compiler=msvc --check-cxx-compiler=msvc --dist-target=msvc --boost-include="%BOOST_INCLUDE%" --noconfirm

      - name: Upload configuration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chm-ardour-configure-logs
          path: |
            ardour/build/config.log
            ardour/build/c4che/
          if-no-files-found: warn
