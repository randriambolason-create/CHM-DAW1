
name: CHM DAW - Windows Xmake Dependencies

on:
  workflow_dispatch:

jobs:
  dependencies:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check Visual Studio and LLVM
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          & $vswhere -latest -products * -property installationVersion

          where.exe cl 2>$null
          where.exe llvm-nm 2>$null

          Write-Host "Toolchain inspection completed"

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Check Xmake
        shell: pwsh
        run: |
          xmake --version
          xrepo --version

      - name: Download official Ardour dependency recipe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stack | Out-Null

          $url = "https://gist.githubusercontent.com/x42/0e3f7bf6380c086e9ff57f8f34298172/raw/ardour-build-dep.lua"

          Invoke-WebRequest -Uri $url -OutFile stack/xmake.lua

          if (!(Test-Path stack/xmake.lua)) {
            throw "Ardour dependency recipe missing"
          }

          Get-Content stack/xmake.lua -TotalCount 30

      - name: Update Xrepo
        shell: pwsh
        run: |
          xrepo update-repo

      - name: Configure dependency stack
        shell: pwsh
        working-directory: stack
        run: |
          xmake f -c -y
          if ($LASTEXITCODE -ne 0) {
            throw "Xmake configuration failed"
          }

      - name: Build dependency stack
        shell: pwsh
        working-directory: stack
        run: |
          xmake -y
          if ($LASTEXITCODE -ne 0) {
            throw "Dependency build failed"
          }

      - name: Inspect compiled dependencies
        shell: pwsh
        run: |
          Get-ChildItem stack -Directory
          Get-ChildItem stack -Recurse -Filter "*.pc" |
            Select-Object -First 40 -ExpandProperty FullName

      - name: Upload dependency logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chm-daw-xmake-diagnostics
          path: |
            stack/.xmake/
            stack/build/
          if-no-files-found: ignore
