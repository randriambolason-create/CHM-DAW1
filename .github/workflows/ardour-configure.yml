
name: CHM DAW - Windows Full Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Download dependency recipe
        shell: pwsh
        run: |
          git clone https://gist.github.com/0e3f7bf6380c086e9ff57f8f34298172.git recipe
          if ($LASTEXITCODE -ne 0) { throw "Recipe clone failed" }

          New-Item -ItemType Directory -Force stack | Out-Null
          Copy-Item recipe/ardour-depxs-xmakes.lua stack/xmake.lua

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            stack/release
            ~/.xmake
          key: chm-ardour-stack-win-v2

      - name: Build dependency stack
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: stack
        run: |
          xrepo update-repo
          if ($LASTEXITCODE -ne 0) { throw "Xrepo failed" }

          xmake f -c -y
          if ($LASTEXITCODE -ne 0) { throw "Xmake configure failed" }

          xmake -y
          if ($LASTEXITCODE -ne 0) { throw "Xmake build failed" }

      - name: Verify dependency stack
        shell: pwsh
        run: |
          if (!(Test-Path stack/release/lib)) {
            throw "Missing dependency libraries"
          }

          Get-ChildItem stack/release

      - name: Download Ardour source
        shell: pwsh
        run: |
          git clone https://github.com/Ardour/ardour.git ardour
          if ($LASTEXITCODE -ne 0) {
            throw "Ardour clone failed"
          }

      - name: Locate MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (!$vs) { throw "MSVC not found" }

          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"

          if (!(Test-Path $vcvars)) {
            throw "vcvars64.bat missing"
          }

          "VCVARS=$vcvars" >> $env:GITHUB_ENV

      - name: Configure and compile Ardour
        shell: cmd
        run: |
          @echo off

          call "%VCVARS%"
          if errorlevel 1 exit /b 1

          where cl
          if errorlevel 1 exit /b 1

          where ml64
          if errorlevel 1 exit /b 1

          where link
          if errorlevel 1 exit /b 1

          where llvm-nm
          if errorlevel 1 exit /b 1

          set "STACK=%CD%\stack\release"
          set "PATH=%STACK%\bin;%PATH%"
          set "PKG_CONFIG_PATH=%STACK%\lib\pkgconfig"

          cd ardour

          python waf configure --prefix=C:\ArdourMSVC --configdir=share --ptformat --dist-target=msvc --cxx17 --optimize --also-include="%STACK%\include" --also-libdir="%STACK%\lib"

          if errorlevel 1 (
            echo ARDOUR CONFIGURATION FAILED
            exit /b 1
          )

          echo ARDOUR CONFIGURATION SUCCESS

          python waf

          if errorlevel 1 (
            echo ARDOUR BUILD FAILED
            exit /b 1
          )

          echo ARDOUR BUILD SUCCESS

      - name: Upload build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chm-daw-windows-build-16
          path: |
            ardour/build/
          if-no-files-found: warn
          retention-days: 7
