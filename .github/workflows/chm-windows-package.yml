
name: CHM DAW - Windows Full Build and Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Download dependency recipe
        shell: pwsh
        run: |
          git clone https://gist.github.com/0e3f7bf6380c086e9ff57f8f34298172.git recipe
          if ($LASTEXITCODE -ne 0) { throw "Recipe clone failed" }
          New-Item -ItemType Directory -Force stack | Out-Null
          Copy-Item recipe/ardour-depxs-xmakes.lua stack/xmake.lua

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            stack/release
            ~/.xmake
          key: chm-ardour-stack-win-v2

      - name: Build dependency stack if needed
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: stack
        run: |
          xrepo update-repo
          if ($LASTEXITCODE -ne 0) { throw "Xrepo update failed" }
          xmake f -c -y
          if ($LASTEXITCODE -ne 0) { throw "Xmake configure failed" }
          xmake -y
          if ($LASTEXITCODE -ne 0) { throw "Xmake build failed" }

      - name: Find Boost and Raptor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $roots = @(
            "$env:GITHUB_WORKSPACE/stack/release/include",
            "$env:LOCALAPPDATA/.xmake/packages",
            "$env:USERPROFILE/.xmake/packages"
          )

          $found = @()

          foreach ($root in $roots) {
            if (Test-Path $root) {
              $found += Get-ChildItem $root -Recurse -File -Filter version.hpp -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq "boost" }
            }
          }

          $found = @($found | Sort-Object FullName -Unique)

          if ($found.Count -eq 0) {
            throw "Boost version.hpp not found"
          }

          $boostRoot = Split-Path $found[0].Directory.FullName -Parent
          Write-Host "BOOST INCLUDE: $boostRoot"
          "BOOST_INCLUDE=$boostRoot" >> $env:GITHUB_ENV

          $raptor = "$env:GITHUB_WORKSPACE/stack/release/include/raptor2"

          if (!(Test-Path "$raptor/raptor.h")) {
            throw "Raptor header missing"
          }

          "RAPTOR_INCLUDE=$raptor" >> $env:GITHUB_ENV

      - name: Download Ardour source
        shell: pwsh
        run: |
          git clone https://github.com/Ardour/ardour.git ardour
          if ($LASTEXITCODE -ne 0) { throw "Ardour clone failed" }

      - name: Locate MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (!$vs) { throw "MSVC not found" }

          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"

          if (!(Test-Path $vcvars)) { throw "MSVC setup missing" }

          "VCVARS=$vcvars" >> $env:GITHUB_ENV

      - name: Configure and compile Ardour
        shell: cmd
        run: |
          @echo off
          call "%VCVARS%"
          if errorlevel 1 exit /b 1

          set "STACK=%CD%\stack\release"
          set "PATH=%STACK%\bin;%PATH%"
          set "PKG_CONFIG_PATH=%STACK%\lib\pkgconfig"
          set "INCLUDE=%BOOST_INCLUDE%;%RAPTOR_INCLUDE%;%STACK%\include;%INCLUDE%"

          cd ardour

          python waf configure --prefix=C:\ArdourMSVC --configdir=share --ptformat --dist-target=msvc --cxx17 --optimize --also-include="%BOOST_INCLUDE%" --also-include="%RAPTOR_INCLUDE%" --also-include="%STACK%\include" --also-libdir="%STACK%\lib"
          if errorlevel 1 exit /b 1

          echo ARDOUR CONFIGURATION SUCCESS

          python waf
          if errorlevel 1 exit /b 1

          echo ARDOUR BUILD SUCCESS

      - name: Assemble experimental Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force package/build | Out-Null

          Copy-Item ardour/build/* package/build/ -Recurse -Force

          if (Test-Path stack/release/bin) {
            Copy-Item stack/release/bin package/dependency-bin -Recurse -Force
          }

          if (Test-Path stack/release/share) {
            Copy-Item stack/release/share package/dependency-share -Recurse -Force
          }

          $exe = Get-ChildItem package/build -Recurse -File -Filter "ardour-*.exe" |
            Where-Object { $_.FullName -match "gtk2_ardour" } |
            Select-Object -First 1

          if (!$exe) {
            throw "Ardour executable not found"
          }

          Write-Host "FOUND EXECUTABLE: $($exe.FullName)"

          @"
          CHM DAW - Windows Experimental Build

          This package contains compiled Ardour files
          and available dependency resources.

          It is NOT yet a verified portable application
          or a finished Windows installer.

          Additional runtime libraries, GTK resources,
          environment configuration and a launcher
          may still be required.

          Ardour source:
          https://github.com/Ardour/ardour

          Review Ardour and dependency licenses before
          redistributing this package.
          "@ | Set-Content package/README.txt

          Compress-Archive -Path package/* `
            -DestinationPath CHM-DAW-Windows-Test.zip -Force

          Get-Item CHM-DAW-Windows-Test.zip |
            Select-Object Name, Length

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: CHM-DAW-Windows-Test
          path: CHM-DAW-Windows-Test.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CHM-DAW-Build-Diagnostics
          path: |
            ardour/build/config.log
          if-no-files-found: ignore
          retention-days: 7
