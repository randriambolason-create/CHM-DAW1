
name: CHM DAW - Windows Boost Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Download dependency recipe
        shell: pwsh
        run: |
          git clone https://gist.github.com/0e3f7bf6380c086e9ff57f8f34298172.git recipe
          if ($LASTEXITCODE -ne 0) { throw "Recipe clone failed" }
          New-Item -ItemType Directory -Force stack | Out-Null
          Copy-Item recipe/ardour-depxs-xmakes.lua stack/xmake.lua

      - name: Restore dependency cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            stack/release
            ~/.xmake
          key: chm-ardour-stack-win-v2

      - name: Build dependency stack if needed
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: stack
        run: |
          xrepo update-repo
          if ($LASTEXITCODE -ne 0) { throw "Xrepo failed" }
          xmake f -c -y
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
          xmake -y
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: Find Boost and Raptor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Searching Boost headers..."

          $roots = @(
            "$env:GITHUB_WORKSPACE/stack/release/include",
            "$env:LOCALAPPDATA/.xmake/packages",
            "$env:USERPROFILE/.xmake/packages"
          )

          $found = @()

          foreach ($root in $roots) {
            if (Test-Path $root) {
              $found += Get-ChildItem $root -Recurse -File -Filter version.hpp -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq "boost" }
            }
          }

          $found = @($found | Sort-Object FullName -Unique)

          if ($found.Count -eq 0) {
            Write-Host "::error::Boost version.hpp not found"
            throw "Boost headers missing from searched locations"
          }

          foreach ($file in $found) {
            Write-Host "FOUND: $($file.FullName)"
          }

          $header = $found[0]
          $boostRoot = Split-Path $header.Directory.FullName -Parent

          Write-Host "BOOST INCLUDE ROOT: $boostRoot"

          "BOOST_INCLUDE=$boostRoot" >> $env:GITHUB_ENV

          $raptor = "$env:GITHUB_WORKSPACE/stack/release/include/raptor2"

          if (Test-Path "$raptor/raptor.h") {
            Write-Host "Raptor header found"
          } else {
            throw "Raptor header missing"
          }

          "RAPTOR_INCLUDE=$raptor" >> $env:GITHUB_ENV

      - name: Locate MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

          if (!$vs) { throw "MSVC not found" }

          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"

          if (!(Test-Path $vcvars)) {
            throw "MSVC setup missing"
          }

          "VCVARS=$vcvars" >> $env:GITHUB_ENV

      - name: Test Boost with MSVC
        shell: cmd
        run: |
          @echo off
          call "%VCVARS%"
          if errorlevel 1 exit /b 1

          echo #include ^<boost/version.hpp^> > boost-test.cpp
          echo int main() { return 0; } >> boost-test.cpp

          cl /nologo /I"%BOOST_INCLUDE%" /c boost-test.cpp
          if errorlevel 1 exit /b 1

          echo BOOST HEADER TEST SUCCESS

      - name: Download Ardour source
        shell: pwsh
        run: |
          git clone https://github.com/Ardour/ardour.git ardour
          if ($LASTEXITCODE -ne 0) {
            throw "Ardour clone failed"
          }

      - name: Configure Ardour with Boost
        shell: cmd
        run: |
          @echo off
          call "%VCVARS%"
          if errorlevel 1 exit /b 1

          set "STACK=%CD%\stack\release"
          set "PATH=%STACK%\bin;%PATH%"
          set "PKG_CONFIG_PATH=%STACK%\lib\pkgconfig"
          set "INCLUDE=%BOOST_INCLUDE%;%RAPTOR_INCLUDE%;%STACK%\include;%INCLUDE%"

          cd ardour

          python waf configure --prefix=C:\ArdourMSVC --configdir=share --ptformat --dist-target=msvc --cxx17 --optimize --also-include="%BOOST_INCLUDE%" --also-include="%RAPTOR_INCLUDE%" --also-include="%STACK%\include" --also-libdir="%STACK%\lib"

          if errorlevel 1 exit /b 1

          echo ARDOUR CONFIGURATION SUCCESS

      - name: Upload configuration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CHM-DAW-Boost-Diagnostics
          path: |
            ardour/build/config.log
          if-no-files-found: ignore
          retention-days: 7
